name: Build Screw Factory APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -q ac-screw-factory-v3-trial.zip

      - name: Setup Capacitor Android
        working-directory: ac-screw-factory
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Add Storage Permissions
        working-directory: ac-screw-factory
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        working-directory: ac-screw-factory/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AC-Screw-Factory-APK
          path: ac-screw-factory/android/app/build/outputs/apk/debug/app-debug.apk
